# Runs the tests automatically on every push and pull request.
# Results appear in the "Actions" tab and as a tick or cross on each pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: pytest -q
